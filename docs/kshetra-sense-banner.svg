<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">KshetraSense crop recommendation system</title>
  <desc id="desc">A visual summary of the KshetraSense machine learning project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f1b"/>
      <stop offset="1" stop-color="#23733e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#04150b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1110" cy="-25" r="220" fill="#8fe3a6" opacity="0.08"/>
  <circle cx="1020" cy="430" r="170" fill="#f0c66d" opacity="0.08"/>

  <g transform="translate(72 58)">
    <g transform="translate(0 5)">
      <path d="M24 48C22 21 36 5 63 4C65 30 51 47 24 48Z" fill="#8fe3a6"/>
      <path d="M23 51C21 32 10 21 0 19C0 40 8 51 23 51Z" fill="#d9ef85"/>
      <path d="M24 46V76" stroke="#f6fff2" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="82" y="52" fill="#f6fff2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5">KSHETRASENSE</text>
    <text x="0" y="140" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="800" letter-spacing="-1.5">Smarter crop choices.</text>
    <text x="0" y="198" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="800" letter-spacing="-1.5">Grounded in data.</text>
    <text x="0" y="247" fill="#d5ead9" font-family="Arial, Helvetica, sans-serif" font-size="20">Machine-learning recommendations from soil</text>
    <text x="0" y="277" fill="#d5ead9" font-family="Arial, Helvetica, sans-serif" font-size="20">nutrients and climate conditions.</text>
  </g>

  <g transform="translate(755 74)" filter="url(#shadow)">
    <rect width="373" height="272" rx="24" fill="url(#card)" stroke="#b9e7c5" stroke-opacity="0.34"/>
    <text x="32" y="46" fill="#b9e7c5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PROJECT AT A GLANCE</text>
    <g transform="translate(32 72)">
      <rect width="145" height="76" rx="15" fill="#f6fff2" fill-opacity="0.10"/>
      <text x="18" y="34" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">2,200</text>
      <text x="18" y="57" fill="#cbe5d1" font-family="Arial, Helvetica, sans-serif" font-size="14">training records</text>
      <rect x="164" width="145" height="76" rx="15" fill="#f6fff2" fill-opacity="0.10"/>
      <text x="182" y="34" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">22</text>
      <text x="182" y="57" fill="#cbe5d1" font-family="Arial, Helvetica, sans-serif" font-size="14">crop classes</text>
      <rect y="92" width="145" height="76" rx="15" fill="#f6fff2" fill-opacity="0.10"/>
      <text x="18" y="126" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">7</text>
      <text x="18" y="149" fill="#cbe5d1" font-family="Arial, Helvetica, sans-serif" font-size="14">input features</text>
      <rect x="164" y="92" width="145" height="76" rx="15" fill="#f0c66d" fill-opacity="0.14"/>
      <text x="182" y="126" fill="#ffe3a4" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">99.55%</text>
      <text x="182" y="149" fill="#e9d7ad" font-family="Arial, Helvetica, sans-serif" font-size="14">test accuracy</text>
    </g>
  </g>
</svg>
