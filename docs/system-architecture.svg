<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">KshetraSense system architecture</title>
  <desc id="desc">The user enters field data, guardrails detect unsupported inputs, a calibrated model ranks crops, and Streamlit explains or abstains.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf6"/>
      <stop offset="1" stop-color="#edf7ef"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#4b7658"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#173e25" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#panel)"/>
  <text x="600" y="58" text-anchor="middle" fill="#163d24" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">Single-service Streamlit architecture</text>
  <text x="600" y="88" text-anchor="middle" fill="#64806b" font-family="Arial, Helvetica, sans-serif" font-size="16">Everything required for inference is loaded directly from the repository</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(55 148)">
      <rect width="215" height="220" rx="22" fill="#ffffff" stroke="#c5ddca"/>
      <circle cx="108" cy="55" r="28" fill="#dff3e4"/>
      <path d="M88 62C88 47 96 39 108 39C120 39 128 47 128 62" fill="none" stroke="#257642" stroke-width="5" stroke-linecap="round"/>
      <circle cx="108" cy="34" r="12" fill="#257642"/>
      <text x="108" y="112" text-anchor="middle" fill="#173e25" font-size="20" font-weight="700">User inputs</text>
      <text x="108" y="143" text-anchor="middle" fill="#65786a" font-size="14">N · P · K · temperature</text>
      <text x="108" y="165" text-anchor="middle" fill="#65786a" font-size="14">humidity · pH · rainfall</text>
      <text x="108" y="196" text-anchor="middle" fill="#2b7242" font-size="13" font-weight="700">Validated in the form</text>
    </g>

    <g transform="translate(345 148)">
      <rect width="215" height="220" rx="22" fill="#ffffff" stroke="#c5ddca"/>
      <circle cx="108" cy="55" r="28" fill="#fff2d7"/>
      <path d="M91 44H125M91 55H125M91 66H125" stroke="#b27a12" stroke-width="4" stroke-linecap="round"/>
      <text x="108" y="112" text-anchor="middle" fill="#173e25" font-size="20" font-weight="700">Safety guard</text>
      <text x="108" y="143" text-anchor="middle" fill="#65786a" font-size="14">Observed-range checks</text>
      <text x="108" y="165" text-anchor="middle" fill="#65786a" font-size="14">Multivariate OOD distance</text>
      <text x="108" y="196" text-anchor="middle" fill="#8a641f" font-size="13" font-weight="700">Warn or abstain</text>
    </g>

    <g transform="translate(635 148)">
      <rect width="215" height="220" rx="22" fill="#163d24" stroke="#163d24"/>
      <circle cx="108" cy="55" r="28" fill="#2f6d43"/>
      <path d="M108 31V78M91 42L108 54L125 42M91 68L108 56L125 68" fill="none" stroke="#d8f0dd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="108" y="112" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Calibrated model</text>
      <text x="108" y="143" text-anchor="middle" fill="#cbe3d0" font-size="14">Random Forest pipeline</text>
      <text x="108" y="165" text-anchor="middle" fill="#cbe3d0" font-size="14">Temperature scaling</text>
      <text x="108" y="196" text-anchor="middle" fill="#9de0ac" font-size="13" font-weight="700">Verified artifact bundle</text>
    </g>

    <g transform="translate(925 148)">
      <rect width="215" height="220" rx="22" fill="#ffffff" stroke="#c5ddca"/>
      <circle cx="108" cy="55" r="28" fill="#dff3e4"/>
      <rect x="90" y="45" width="8" height="21" rx="3" fill="#73bd85"/>
      <rect x="103" y="37" width="8" height="29" rx="3" fill="#46975d"/>
      <rect x="116" y="28" width="8" height="38" rx="3" fill="#23733e"/>
      <text x="108" y="112" text-anchor="middle" fill="#173e25" font-size="20" font-weight="700">Streamlit result</text>
      <text x="108" y="143" text-anchor="middle" fill="#65786a" font-size="14">Ranking or safe abstention</text>
      <text x="108" y="165" text-anchor="middle" fill="#65786a" font-size="14">Explanations / charts / EDA</text>
      <text x="108" y="196" text-anchor="middle" fill="#2b7242" font-size="13" font-weight="700">Transparent decision support</text>
    </g>
  </g>

  <g stroke="#4b7658" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M276 258H333"/>
    <path d="M566 258H623"/>
    <path d="M856 258H913"/>
  </g>
  <rect x="286" y="416" width="628" height="55" rx="17" fill="#ffffff" stroke="#c5ddca"/>
  <text x="600" y="449" text-anchor="middle" fill="#3d6549" font-family="Arial, Helvetica, sans-serif" font-size="15">Checksums, schema validation, OOD thresholds, and abstention protect every inference</text>
</svg>
